   <div class="frow"><label>Stop level</label><select id="dsStUnit"><option value="Price" ${st.stopUnit!=="Ticks"?"selected":""}>Price</option><option value="Ticks" ${st.stopUnit==="Ticks"?"selected":""}>Ticks</option></select><input type="number" id="dsStop" value="${d.stop}" step="any"></div>
   <p class="hint">Ticks を選ぶと、入力値はティック数として Entry から換算します（1ティック = 最小価格単位）。Qty 欄の入力は参考値で、契約倍率が既知の場合は Risk% から算出した計算値（Risk計算値）を表示・計算に優先します。</p>
   <p class="hint">数量は Account × Risk% ÷ (Entry−Stop距離 × 契約倍率) で計算（倍率未設定時は価格差ベース）</p>
  </div>`:""}
  <div data-pane="Style"${isPos?' style="display:none"':""}>
   <div class="frow"${isFib?' style="display:none"':""}><label>線の色</label><input type="color" id="dsColor" value="${st.color}"><input type="text" id="dsColorHex" value="${st.color}"><label style="width:auto">Opacity</label><input type="number" id="dsOp" min="0" max="100" value="${st.opacity}" style="width:76px;flex:none">%</div>
   <div class="frow"${isFib?' style="display:none"':""}><label>太さ</label><span class="seg" id="dsW">${[1,2,3,4].map(w=>`<button data-w="${w}" class="${st.width===w?"on":""}">${w}px</button>`).join("")}</span>
   <label style="width:auto">線種</label><span class="seg" id="dsLS">${["Line","Dashed","Dotted"].map(s=>`<button data-s="${s}" class="${st.lineStyle===s?"on":""}">${s}</button>`).join("")}</span></div>
   ${(d.type==="line"||d.type==="arrow")?`<div class="frow"><label>端点スタイル</label>左 <span class="seg" id="dsEL">${["Normal","Arrow"].map(s=>`<button data-s="${s}" class="${st.endL===s?"on":""}">${s}</button>`).join("")}</span> 右 <span class="seg" id="dsER">${["Normal","Arrow"].map(s=>`<button data-s="${s}" class="${st.endR===s?"on":""}">${s}</button>`).join("")}</span></div>
   <div class="frow"><label>Extend</label><label class="chk"><input type="checkbox" id="dsExL" ${st.extendL?"checked":""}> Extend left line</label><label class="chk"><input type="checkbox" id="dsExR" ${st.extendR?"checked":""}> Extend right line</label></div>`:""}
   ${d.type==="rect"?`<div class="frow"><label>背景</label><label class="chk"><input type="checkbox" id="dsBgOn" ${st.bgOn!==false?"checked":""}> Background</label><input type="color" id="dsBg" value="${st.bg}"><label style="width:auto">Opacity</label><input type="number" id="dsBgOp" min="0" max="100" value="${st.bgOpacity}" style="width:76px;flex:none">%</div>`:""}
   ${isPos?`<div class="frow"><label>INFO / Stats</label><label class="chk"><input type="checkbox" id="dsShowInfo" ${st.showInfo!==false?"checked":""}> INFO</label><label class="chk"><input type="checkbox" id="dsCompact" ${st.compactStats?"checked":""}> Compact stats mode</label><label class="chk"><input type="checkbox" id="dsAlwaysStats" ${st.alwaysShowStats?"checked":""}> Always show stats</label></div>
   <div class="frow"><label>表示</label><label class="chk"><input type="checkbox" id="dsPriceLabels" ${st.priceLabels!==false?"checked":""}> Price labels</label><label class="chk"><input type="checkbox" id="dsMid" ${st.middlePoint?"checked":""}> Middle point</label></div>
   <div class="frow"><label>Target色</label><input type="color" id="dsTgC" value="${st.targetColor}"><label style="width:auto">Opacity</label><input type="number" id="dsTgOp" min="0" max="100" value="${st.targetOpacity}" style="width:70px;flex:none">%</div>
   <div class="frow"><label>Stop色</label><input type="color" id="dsStC" value="${st.stopColor}"><label style="width:auto">Opacity</label><input type="number" id="dsStOp" min="0" max="100" value="${st.stopOpacity}" style="width:70px;flex:none">%</div>`:""}
   ${isFib?`<div class="frow"><label>OTEゾーン</label><span class="hint">0.618〜0.786 を金色で表示中</span><label class="chk"><input type="checkbox" id="dsFibBg" ${st.fibBg?"checked":""}> Background</label><label class="chk"><input type="checkbox" id="dsFibRev" ${st.fibReverse?"checked":""}> Reverse</label></div>
   <div class="frow"><label>Fib表示</label><label class="chk"><input type="checkbox" id="dsFibPrices" ${st.fibPrices!==false?"checked":""}> Prices</label><label class="chk"><input type="checkbox" id="dsFibLv" ${st.fibLevelsLbl!==false?"checked":""}> Levels</label><label class="chk"><input type="checkbox" id="dsFibLabels" ${st.fibLabels!==false?"checked":""}> Labels</label><label style="width:auto">Font size</label><input type="number" id="dsFibFS" value="${st.fibFontSize||12}" style="width:64px;flex:none"></div>
   <div class="frow"><label>Levels line</label><span class="seg" id="dsFibW">${[1,2,3,4].map(w=>`<button data-w="${w}" class="${(st.fibLineWidth||1)===w?"on":""}">${w}px</button>`).join("")}</span><span class="seg" id="dsFibLS">${["Line","Dashed","Dotted"].map(x=>`<button data-s="${x}" class="${(st.fibLineStyle||"Line")===x?"on":""}">${x}</button>`).join("")}</span></div>
   <div class="frow"><label>Use one color</label><input type="color" id="dsFibOne" value="${(st.fibLevels.find(f=>f.on)||st.fibLevels[0]||{}).color||"#2962ff"}"><button class="btn" type="button" id="dsFibOneBtn">全レベルに適用</button><span class="hint">全24レベルの色をこの色に統一します（本家の Use one color）</span></div>
   <div class="frow"><label>log scale</label><label class="chk"><input type="checkbox" disabled> log scale（このチャートでは無効）</label></div>
   <div id="dsFib">${st.fibLevels.map((fl,i)=>`<div class="fibRow"><label class="chk"><input type="checkbox" data-fi="${i}" ${fl.on?"checked":""}></label><input type="number" step="0.001" data-fv="${i}" value="${fl.level}"><input type="color" data-fc="${i}" value="${fl.color}"><button class="btn" data-fuse="${i}">この色を全レベルに</button></div>`).join("")}</div>`:""}
  </div>
  <div data-pane="Text" style="display:none">
   <div class="frow"><label>テキスト</label><input type="text" id="dsText" value="${(st.text||"").replace(/"/g,"&quot;")}" placeholder="Add text"></div>
   <div class="frow"><label>文字色</label><input type="color" id="dsTC" value="${st.textColor}"><label style="width:auto">サイズ</label><input type="number" id="dsFS" value="${st.fontSize}" min="8" max="48" style="width:76px;flex:none">
   <label class="chk"><input type="checkbox" id="dsBold" ${st.bold?"checked":""}> <b>B 太字</b></label><label class="chk"><input type="checkbox" id="dsItal" ${st.italic?"checked":""}> <i>I 斜体</i></label></div>
   <div class="frow"><label>配置</label><span class="seg" id="dsAlign">${(d.type==="rect"?["Inside","Center"]:["Top","Center"]).map(s=>`<button data-s="${s}" class="${st.align===s?"on":""}">${s}</button>`).join("")}</span></div>
   ${d.type==="text"?`<div class="frow"><label>背景 / 枠線</label><label class="chk"><input type="checkbox" id="dsTxBgOn" ${st.bgOn?"checked":""}> Background</label><input type="color" id="dsTxBg" value="${st.bg}"><label style="width:auto">Opacity</label><input type="number" id="dsTxBgOp" min="0" max="100" value="${st.bgOpacity}" style="width:76px;flex:none">%（既定25%）</div>`:""}
  </div>
  <div data-pane="Coordinates" style="display:none">
   <div class="frow"><label>#1 price / bar</label><input type="number" id="dsP1" step="any" value="${d.p1.price}"><input type="number" id="dsB1" value="${barIdx(d.p1.time)}"></div>
   ${d.p2?`<div class="frow"><label>#2 price / bar</label><input type="number" id="dsP2" step="any" value="${d.p2.price}"><input type="number" id="dsB2" value="${barIdx(d.p2.time)}"></div>`:""}
   <p class="hint">bar は表示データ先頭からの本数です。値を変えると描画の端点が移動します。</p>
  </div>
  <div data-pane="Visibility" style="display:none">
   <p class="hint">表示区分（本家と同じ Ticks / Seconds / Minutes / Hours / Days / Weeks / Months / Ranges）。Minutes は 1m/5m/15m、Hours は 1h/4h、Days は 1D に対応します。</p>
   ${["Ticks","Seconds","Minutes","Hours","Days","Weeks","Months","Ranges"].map(c=>`<label class="chk" style="margin-right:10px"><input type="checkbox" data-viscat="${c}" ${!d.visCats||d.visCats[c]!==false?"checked":""}> ${c}</label>`).join("")}
   <div class="frow"><label class="chk"><input type="checkbox" id="dsLocked" ${d.locked?"checked":""}> ロック（削除・移動不可）</label></div>
  </div>`,
  `<button class="btn" id="dsCancel">キャンセル</button><button class="btn primary" id="dsOk">OK</button>`);
 $("#dsSync").value=d.syncScope||"layout";
 m.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{m.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));m.querySelectorAll("[data-pane]").forEach(p=>p.style.display=p.dataset.pane===b.dataset.tab?"":"none");});
 const segWire=(id,fn)=>{const s=$(id); if(s)s.querySelectorAll("button").forEach(b=>b.onclick=()=>{fn(b.dataset);s.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));});};
 segWire("#dsW",ds=>st.width=+ds.w); segWire("#dsLS",ds=>st.lineStyle=ds.s); segWire("#dsEL",ds=>st.endL=ds.s); segWire("#dsER",ds=>st.endR=ds.s); segWire("#dsAlign",ds=>st.align=ds.s);
 segWire("#dsFibW",ds=>st.fibLineWidth=+ds.w); segWire("#dsFibLS",ds=>st.fibLineStyle=ds.s);
 /* 線の色: カラーピッカーと16進数テキストを相互同期する（従来は dsColorHex が読み書きされず、16進数で色を変えてもOKに反映されなかった） */
 const _dcI=$("#dsColor"), _dcH=$("#dsColorHex");
 if(_dcI&&_dcH){ _dcI.addEventListener("input",()=>{_dcH.value=_dcI.value;});
  _dcH.addEventListener("change",()=>{ const v=_dcH.value.trim(); if(/^#?[0-9a-fA-F]{6}$/.test(v)){ _dcI.value="#"+v.replace("#","").toLowerCase(); _dcH.value=_dcI.value; } }); }
 $("#dsTmpl").onclick=()=>openTemplateMenu(ctx,d);
 $("#dsCancel").onclick=closeModal;
 $("#dsOk").onclick=()=>{ snapshotDrawings(); d.style=st; // スナップショット後に複製を適用
  const _dc=$("#dsColor"); if(_dc){st.color=_dc.value; st.opacity=+$("#dsOp").value;}
  const bgOn=$("#dsBgOn"); if(bgOn){st.bgOn=bgOn.checked; st.bg=$("#dsBg").value; st.bgOpacity=+$("#dsBgOp").value;}
  const exL=$("#dsExL"); if(exL){st.extendL=exL.checked; st.extendR=$("#dsExR").checked;}
  if(isPos){st.accountSize=+$("#dsAcc").value; st.lotSize=+$("#dsLot").value; st.risk=+$("#dsRisk").value; st.leverage=+$("#dsLev").value; st.qty=+$("#dsQty").value;
   const _qp=$("#dsQp"); if(_qp)st.qtyPrecision=_qp.value;
   d.entry=+$("#dsEntry").value;
   const _tick=Math.pow(10,-(symInfo(ctx.symbol).dec||2)); const _long=d.type==="long";
   const _tgu=$("#dsTgUnit"), _stu=$("#dsStUnit"); st.targetUnit=_tgu?_tgu.value:"Price"; st.stopUnit=_stu?_stu.value:"Price";
   d.target=st.targetUnit==="Ticks" ? d.entry + (+$("#dsTarget").value)*_tick*(_long?1:-1) : +$("#dsTarget").value;
   d.stop=st.stopUnit==="Ticks" ? d.entry - (+$("#dsStop").value)*_tick*(_long?1:-1) : +$("#dsStop").value;
   d.p1.price=d.entry;
   st.targetColor=$("#dsTgC").value; st.targetOpacity=+$("#dsTgOp").value; st.stopColor=$("#dsStC").value; st.stopOpacity=+$("#dsStOp").value;}
  if(isFib){st.fibBg=$("#dsFibBg").checked; st.fibReverse=$("#dsFibRev").checked;
   m.querySelectorAll("[data-fi]").forEach(c=>{st.fibLevels[+c.dataset.fi].on=c.checked;});
   m.querySelectorAll("[data-fv]").forEach(c=>{st.fibLevels[+c.dataset.fv].level=+c.value;});
   m.querySelectorAll("[data-fc]").forEach(c=>{st.fibLevels[+c.dataset.fc].color=c.value;});}
  const _t=$("#dsText"); if(_t){st.text=_t.value; st.textColor=$("#dsTC").value; st.fontSize=+$("#dsFS").value; st.bold=$("#dsBold").checked; st.italic=$("#dsItal").checked;}
  const _fp=$("#dsFibPrices"); if(_fp){st.fibPrices=_fp.checked; st.fibLevelsLbl=$("#dsFibLv").checked; st.fibLabels=$("#dsFibLabels").checked; st.fibFontSize=+$("#dsFibFS").value;}
  const _si=$("#dsShowInfo"); if(_si){st.showInfo=_si.checked; st.compactStats=$("#dsCompact").checked; st.alwaysShowStats=$("#dsAlwaysStats").checked; st.priceLabels=$("#dsPriceLabels").checked; st.middlePoint=$("#dsMid").checked;}
  const txBg=$("#dsTxBgOn"); if(txBg){st.bgOn=txBg.checked; st.bg=$("#dsTxBg").value; st.bgOpacity=+$("#dsTxBgOp").value;}
  const _b1=$("#dsB1"); if(_b1){ const timeAt=i=>ctx.full[Math.max(0,Math.min(ctx.full.length-1,i))].time;
  d.p1={time:timeAt(+_b1.value),price:+$("#dsP1").value};
  if(d.p2&&$("#dsP2"))d.p2={time:timeAt(+$("#dsB2").value),price:+$("#dsP2").value}; }
  d.intervals={}; m.querySelectorAll("[data-vis]").forEach(c=>d.intervals[c.dataset.vis]=c.checked);
  d.visCats={}; m.querySelectorAll("[data-viscat]").forEach(c=>d.visCats[c.dataset.viscat]=c.checked);
  d.locked=$("#dsLocked").checked; d.syncScope=$("#dsSync").value;
  lastStyles[d.type]=JSON.parse(JSON.stringify(st));
  afterDrawChange(ctx); showFloatBar(ctx,d); closeModal(); };
 if(isFib)m.querySelectorAll("[data-fuse]").forEach(b=>b.onclick=()=>{const inp=m.querySelector(`[data-fc="${b.dataset.fuse}"]`); const c=inp?inp.value:st.fibLevels[+b.dataset.fuse].color; st.fibLevels.forEach(fl=>fl.color=c); m.querySelectorAll("[data-fc]").forEach(x=>x.value=c); refreshCpSwatches(m); toast("Use one color: 全レベルを "+c+" にしました");}); // 行の色入力はOKまで st に未反映のため、入力欄の現在値を読む（従来は変更前の古い色が全レベルへ伝播した）
 const _oneB=$("#dsFibOneBtn"); if(_oneB)_oneB.onclick=()=>{const c=$("#dsFibOne").value; st.fibLevels.forEach(fl=>fl.color=c); m.querySelectorAll("[data-fc]").forEach(x=>x.value=c); refreshCpSwatches(m); toast("Use one color: 全レベルを "+c+" にしました");};
}
</script>
<script>
/* ============ インジケーター ============ */
let indSeq=0;
const IND_DEFS={
 EMA:{label:"EMA（指数移動平均）",params:{length:20},color:"#2962ff"},
 SMA:{label:"SMA（単純移動平均・既定9）",params:{length:9},color:"#ff9800"},
 VWAP:{label:"VWAP",params:{},color:"#ab47bc"},
 RSI:{label:"RSI（既定14）",params:{length:14},color:"#7e57c2"},
 MACD:{label:"MACD（既定12/26/9）",params:{fast:12,slow:26,signal:9},color:"#2962ff"},
 ATR:{label:"ATR（既定14）",params:{length:14},color:"#f0b90b"},
 VOLUME:{label:"出来高",params:{},color:"#787b86"},
 CUSTOM:{label:"カスタム（JS注入）",params:{},color:"#089981"},
};
function addIndicator(type){
 if(type==="VOLUME"&&App.indicators.some(i=>i.type==="VOLUME")){toast("出来高は既に表示されています");return;}
 const def=IND_DEFS[type];
 const ind={id:"i"+(++indSeq)+Date.now().toString(36),type,params:{...def.params},style:{color:def.color,width:1,style:"Line"},visible:true,visibility:null,code:type==="CUSTOM"?"// calculate(candles, params) => [{time, value}]\nfunction calculate(candles, params){\n  var len = params.length || 20;\n  var out = [];\n  for (var i = 0; i < candles.length; i++){\n    if (i < len - 1) continue;\n    var s = 0; for (var j = 0; j < len; j++) s += candles[i-j].close;\n    out.push({time: candles[i].time, value: s/len});\n  }\n  return out;\n}":"",name:type==="CUSTOM"?"My Indicator":""};
 if(type==="CUSTOM")ind.params={length:20};
 App.indicators.push(ind); markDirty(); P.forEach(c=>c&&renderIndicators(c));
 if(type==="CUSTOM")openIndSettings(ind); else toast(def.label+" を追加しました");
}
function openIndMenu(){
 const m=openModal("インジケーターを追加", Object.entries(IND_DEFS).map(([k,v])=>`<div class="listRow"><span class="grow"><b style="color:#fff">${k}</b> — ${v.label}</span><button class="btn primary" data-add="${k}">追加</button></div>`).join("")+
  `<p class="hint">カスタムは、貼り付けた JavaScript の <span class="kbd">calculate(candles, params) =&gt; [{time, value}]</span> をサンドボックス内で実行します。追加済みインジケーターの設定は右側のオブジェクトツリーの設定ボタンから開けます（Inputs / Style / Visibility の3タブ）。</p>`);
 m.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{addIndicator(b.dataset.add); if(b.dataset.add!=="CUSTOM")closeModal();});
}
function openIndSettings(ind){
 const paramRows=Object.entries(ind.params).filter(([k])=>!["source","maType"].includes(k)).map(([k,v])=>`<div class="frow"><label>${k}</label><input type="number" data-p="${k}" value="${v}" step="any"></div>`).join("");
 const m=openModal("インジケーター設定 — "+ind.type,`
  <div class="dtabs" style="padding:0;margin:0 -16px 6px">${["Inputs","Style","Visibility"].map((t,i)=>`<button data-tab="${t}" class="${i===0?"on":""}">${t}</button>`).join("")}</div>
  <div data-pane="Inputs">${paramRows||'<p class="hint">パラメータはありません</p>'}
   ${ind.type==="CUSTOM"?`<div class="frow"><label>名前</label><input type="text" id="inName" value="${(ind.name||"").replace(/"/g,"&quot;")}"></div><label class="hint">JavaScript（calculate(candles, params) =&gt; [{time, value}]）</label><textarea id="inCode">${(ind.code||"").replace(/</g,"&lt;")}</textarea><div class="frow"><label>再実行</label><button class="btn" type="button" id="inRerun">カスタムJSを再実行（確認ダイアログあり）</button></div>`:""}
   ${["RSI","SMA","EMA","MACD"].includes(ind.type)?`<div class="frow"><label>Source</label><select id="inSource">${["close","open","high","low"].map(x=>`<option ${ind.params.source===x?"selected":""}>${x}</option>`).join("")}</select></div>`:""}
   ${ind.type==="MACD"?`<div class="frow"><label>MAタイプ</label><select id="inMaType">${["EMA","SMA"].map(x=>`<option ${ind.params.maType===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="frow"><label>Signal MA Type</label><select id="inSigType">${["EMA","SMA"].map(x=>`<option ${ind.params.sigType===x?"selected":""}>${x}</option>`).join("")}</select></div>`:""}
   ${ind.type==="RSI"?`<p class="hint">RSI-based MA とバンド色のカスタマイズは未決定事項のため、現行は 70／30 バンドを固定色で表示します。</p>`:""}</div>
  <div data-pane="Style" style="display:none">
   <div class="frow"><label>色</label><input type="color" id="inColor" value="${ind.style.color}"><input type="text" id="inColorHex" value="${ind.style.color}"></div>
   ${ind.type==="MACD"?`<div class="frow"><label>シグナル線の色</label><input type="color" id="inSigColor" value="${ind.style.signalColor||"#ff6d00"}"><input type="text" id="inSigColorHex" value="${ind.style.signalColor||"#ff6d00"}"></div>`:""}
   <div class="frow"><label>太さ</label><span class="seg" id="inW">${[1,2,3,4].map(w=>`<button data-w="${w}" class="${ind.style.width===w?"on":""}">${w}px</button>`).join("")}</span>
   <label style="width:auto">線種</label><span class="seg" id="inLS">${["Line","Dashed","Dotted"].map(s=>`<button data-s="${s}" class="${ind.style.style===s?"on":""}">${s==="Line"?"Solid":s}</button>`).join("")}</span></div>
   <div class="frow"><label class="chk"><input type="checkbox" id="inVis" ${ind.visible!==false?"checked":""}> 表示する</label></div></div>
  <div data-pane="Visibility" style="display:none"><p class="hint">表示する時間足を制限できます。</p>
   ${INTERVALS.map(([iv])=>`<label class="chk" style="margin-right:10px"><input type="checkbox" data-vis="${iv}" ${!ind.visibility||ind.visibility[iv]!==false?"checked":""}> ${iv}</label>`).join("")}</div>`,
  `<button class="btn" id="inDel" style="margin-right:auto">削除</button><button class="btn" id="inCancel">キャンセル</button><button class="btn primary" id="inOk">OK</button>`);
 m.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{m.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));m.querySelectorAll("[data-pane]").forEach(p=>p.style.display=p.dataset.pane===b.dataset.tab?"":"none");});
 let w=ind.style.width,ls=ind.style.style;
 m.querySelectorAll("#inW button").forEach(b=>b.onclick=()=>{w=+b.dataset.w;m.querySelectorAll("#inW button").forEach(x=>x.classList.toggle("on",x===b));});
 m.querySelectorAll("#inLS button").forEach(b=>b.onclick=()=>{ls=b.dataset.s;m.querySelectorAll("#inLS button").forEach(x=>x.classList.toggle("on",x===b));});
 $("#inCancel").onclick=closeModal;
 const _rr=$("#inRerun"); if(_rr)_rr.onclick=()=>{ if(window._customOk)delete window._customOk[ind.id]; if(window._customDenied)delete window._customDenied[ind.id]; closeModal(); P.forEach(c=>c&&renderIndicators(c)); };
 $("#inDel").onclick=()=>{App.indicators=App.indicators.filter(x=>x.id!==ind.id);markDirty();P.forEach(c=>c&&renderIndicators(c));closeModal();};
 $("#inOk").onclick=()=>{ m.querySelectorAll("[data-p]").forEach(inp=>ind.params[inp.dataset.p]=+inp.value);
  ind.style.color=$("#inColor").value; ind.style.width=w; ind.style.style=ls; ind.visible=$("#inVis").checked;

const tabQuotes={}, tabQuotePend={};
function tabQuote(s){ const iv=App.interval, key=s+"|"+iv+"|"+(hubLive?"L":"D");
 if(tabQuotes[key])return tabQuotes[key];
 if(hubLive){ const pendAt=tabQuotePend[key];
   if(!pendAt||Date.now()-pendAt>30000){ tabQuotePend[key]=Date.now(); // 取得中と失敗直後は再試行しない（ティックごとの再送防止に30秒あける）

  return null; }
 const d=genData(s,iv); if(d&&d.length>1){ tabQuotes[key]={close:d[d.length-1].close,prev:d[d.length-2].close}; return tabQuotes[key]; }
 return null; }

 else { const q=tabQuote(s); if(q){ b={close:q.close}; p={close:q.prev}; } }
 if(!b){ if(sp.dataset.v){sp.dataset.v=""; sp.innerHTML="";} return; }
 const dec=(symInfo(s).dec!=null?symInfo(s).dec:2);
 const pr=(+b.close).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
 let html=" "+pr;
 if(p){ const up=b.close-p.close>=0; html=` <span class="${up?"tUp":"tDn"}">${up?"▲":"▼"}</span> ${pr}`; } /* 本家のタブは「銘柄 ▲▼ 現在値」のみで変動値は出ない（本家実画面 2880×1800 のネイティブ切り出しで実測。従来は変動値まで出していた） */

function wallToUtc(v){ const nv=String(v).trim().replace("T"," "); const [dp,tp]=nv.split(" "); if(!dp||!tp)return NaN;
 const [y,mo,da]=dp.split("-").map(Number); const [h,mi]=tp.split(":").map(Number);
 const target=Date.UTC(y,mo-1,da,h,mi)/1000; let guess=target;
 for(let i=0;i<3;i++){ const pp=fmtParts(guess,App.timezone); const asWall=Date.UTC(+pp.year,+pp.month-1,+pp.day,+pp.hour,+pp.minute)/1000; const diff=target-asWall; if(!diff)break; guess+=diff; }
 return guess; }
/* 新しいリプレイ = 新しいバックテストセッション（前回のポジション・注文・残高・損益は引き継がない。初期資金は 1,000,000 USD） */
function resetBacktestSession(){ replay.open=null; replay.pending=null; replay.closed=[]; replay.seq=0; replay.cum=0; replay.capital=1000000; App.trades=[]; }
function startReplay(idx){ const ctx=P[0]; resetBacktestSession(); replay.active=true; replay.barRealStart=Date.now(); ctx.replayIdx=idx; setPaneData(ctx);

function stopReplay(){ // リプレイ終了でバックテストも終了する（ユーザーの決定）。未決済ポジションは最後に表示されたバーの終値で決済、未約定注文は取消。パネルは閉じ、CSVも出せなくなる
 const ctx=P[0]; const lastB=ctx.view[ctx.view.length-1];
 replay.active=false; stopPlay(); if(replay.open&&lastB)closeTrade(lastB.close,lastB.time,"リプレイ終了");
 if(replay.pending){ replay.pending=null; toast("未約定の注文を取り消しました"); }
 ctx.replayIdx=-1; setPaneData(ctx); $("#replayBar").classList.remove("show"); $("#replayBtn").classList.remove("on"); $("#tradesPanel").classList.remove("show"); renderOrders(ctx); markDirty(); }
function updateReplayInfo(){ const ctx=P[0]; const b=ctx.view[ctx.view.length-1];
 $("#rpInfo").textContent=b?`${fmtDTs(b.time)} / ${ctx.view.length} 本目（全${ctx.full.length}本）`:"";
 updateSpeedBtn(); renderOrders(ctx);
 $("#rpLong").disabled=!!replay.open; $("#rpShort").disabled=!!replay.open; $("#rpClose").disabled=!replay.open; }
function stepReplay(dir){ const ctx=P[0]; if(!replay.active)return; replay.barRealStart=Date.now();
 const ni=Math.max(0,Math.min(ctx.full.length-1,ctx.replayIdx+dir)); ctx.replayIdx=ni; setPaneData(ctx);
 const bar=ctx.full[ni]; checkPending(bar); updateFavAdv(bar); if(dir>0)checkTradeHit(bar,ni); updateReplayInfo(); }
function updateFavAdv(bar){ const t=replay.open; if(!t)return; const long=t.side==="Long"; const m=effMult(P[0].symbol)||1;
 const favP=long?bar.high-t.entryPrice:t.entryPrice-bar.low; const advP=long?t.entryPrice-bar.low:bar.high-t.entryPrice;
 t.fav=Math.max(t.fav,favP*t.qty*m); t.adv=Math.max(t.adv,advP*t.qty*m); }
function checkPending(bar){ const pd=replay.pending; if(!pd||replay.open)return; const long=pd.side==="Long"; let hit=false;
 if(pd.ordType==="limit")hit=long?bar.low<=pd.price:bar.high>=pd.price;
 else if(pd.ordType==="stop")hit=long?bar.high>=pd.price:bar.low<=pd.price;
 else if(pd.ordType==="stoplimit"){ if(long?bar.high>=pd.price:bar.low<=pd.price){pd.ordType="limit"; pd.price=pd.limitPrice||pd.price;} }
 if(hit){ replay.pending=null; const ctx=P[0]; const isFx=/XAU|XAG|USD/.test(ctx.symbol)&&symInfo(ctx.symbol).t.includes("FX");
  const pctD=(parseFloat(($("#rpDist")||{}).value)||0.8)/100, distD=pd.price*pctD, longD=pd.side==="Long"; // 右クリック注文などTP/SL未指定の約定には既定距離でブラケットを付ける
  replay.open={num:++replay.seq,side:pd.side,entryTime:bar.time,entryPrice:pd.price,qty:pd.qty||(isFx?1000:1),tp:pd.tp!=null?pd.tp:(longD?pd.price+distD:pd.price-distD),sl:pd.sl!=null?pd.sl:(longD?pd.price-distD:pd.price+distD),fav:0,adv:0,entryIdx:ctx.replayIdx,commission:replay.commission,ordType:pd.ordType,mult:effMult(ctx.symbol),oid:pd.oid||("order_"+uuid4())};
  updateFavAdv(bar); toast(`${pd.side} 予約注文が約定 @ ${pd.price}`); updateReplayInfo(); renderTrades(); } }

function uuid4(){ if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
 return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{ const r=Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16); }); }
function fmtPx(p){ if(!isFinite(p))return ""; const a=Math.abs(p); const dec=a>=100?1:(a>=1?2:4); return p.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtMoney(v){ return (v<0?"-":"+")+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})+" "+replay.currency; }
function exchDisp(sym){ const ex=sym.split(":")[0]||"", tick=(sym.split(":")[1]||"").replace("!",""); return (ex==="CME"&&(tick==="GC1"||tick==="SI1"))?"COMEX":ex; }
function tickStep(sym,p){ const a=Math.abs(p||0); return a>=1000?0.1:a>=100?0.05:a>=10?0.01:0.001; }
function defaultQty(sym){ try{ return symInfo(sym).t.includes("FX")?1000:1; }catch(e){ return 1; } }
function orderTypeName(t){ return t==="limit"?"Limit":t==="stop"?"Stop":"Stop-limit"; }

function setRange(r){ const targets=App.sync.range?P.filter(Boolean):[P[activePane]]; // Range同期は range フラグだけを見る（Timeとは分離）
 for(const ctx of targets){ const d=ctx.full; if(!d||!d.length)continue; const last=d[d.length-1].time;
  const days={"1D":1,"5D":5,"1M":30,"3M":91,"6M":182,"1Y":365,"5Y":1825}[r];
  try{ if(r==="ALL"){ctx.chart.timeScale().setVisibleRange({from:d[0].time,to:last});}
  else if(r==="YTD"){const pp=fmtParts(last,"UTC"); const from=Date.UTC(+pp.year,0,1)/1000; ctx.chart.timeScale().setVisibleRange({from,to:last});}
  else ctx.chart.timeScale().setVisibleRange({from:last-days*86400,to:last}); }catch(e){} } }
